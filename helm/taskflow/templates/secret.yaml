{{- $password := required "Потрібен пароль БД: передайте --set secret.postgresPassword=<пароль>" .Values.secret.postgresPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.fullname" . }}-secret
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s-db:%v/%s" .Values.config.postgresUser ($password | urlquery) (include "taskflow.fullname" .) .Values.db.service.port .Values.config.postgresDb | quote }}
