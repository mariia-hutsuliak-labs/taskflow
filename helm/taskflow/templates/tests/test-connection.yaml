{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "taskflow.fullname" . }}-test-connection
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - sh
        - -c
        - |
          set -e
          echo "перевіряю backend: /health"
          wget -q -O - http://{{ include "taskflow.fullname" . }}-backend:{{ .Values.backend.service.port }}/health
          echo
          echo "перевіряю frontend: /"
          wget -q -O /dev/null http://{{ include "taskflow.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/
          echo "обидві перевірки пройшли"
{{- end }}
