# Значення за замовчуванням відповідають середовищу розробки (dev).

nameOverride: ""
fullnameOverride: ""

# Параметри конфігурації застосунку (потрапляють у ConfigMap)
config:
  postgresDb: taskflow
  postgresUser: taskflow
  pollIntervalSeconds: 10
  # Адреса API, яку frontend використовує в браузері.
  # Без Ingress: http://localhost:8000 (через kubectl port-forward).
  apiUrl: http://localhost:8000

# Secret. Реальні паролі в файлах значень не зберігаємо:
# для prod пароль передається через --set secret.postgresPassword=...
# Значення нижче - навчальний пароль лише для локального dev.
secret:
  postgresPassword: taskflow-dev-password

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/mariia-hutsuliak-labs/taskflow-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/mariia-hutsuliak-labs/taskflow-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    type: NodePort
    port: 80
    # Фіксований nodePort (наприклад 30080) не задаємо за замовчуванням,
    # щоб чарт можна було встановити двічі в один кластер.
    nodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

worker:
  replicaCount: 1
  image:
    repository: ghcr.io/mariia-hutsuliak-labs/taskflow-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

db:
  replicaCount: 1
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false
  className: nginx
  host: taskflow.local
  # Шляхи, які йдуть на backend; все інше ("/") йде на frontend
  apiPaths:
    - path: /tasks
      pathType: Prefix
    - path: /health
      pathType: Exact
    - path: /docs
      pathType: Prefix
    - path: /openapi.json
      pathType: Exact

# Хук і тест релізу (пункт 9b лаби)
hooks:
  preUpgrade:
    # Job перед оновленням: перевіряє, що база даних доступна
    enabled: true

tests:
  # Под для `helm test`: перевіряє backend (/health) і frontend (/)
  enabled: true
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
