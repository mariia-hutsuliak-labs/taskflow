events {}

http {
  upstream taskflow {
    server app1:8000 max_fails=1 fail_timeout=5s;
    server app2:8000 max_fails=1 fail_timeout=5s;
    server app3:8000 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://taskflow;
      proxy_connect_timeout 1s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_set_header Host $host;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
